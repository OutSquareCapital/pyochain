[workspace]
members = [
    ".",
    "./crates/pyochain_build",
    "./crates/pyochain_macros",
    "./crates/pyo3_ext",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
missing_errors_doc = "allow"
wildcard_imports = "allow"
similar_names = "allow"

[lints]
workspace = true
[package]
edition = "2024"
license = "MIT"
name = "pyochain"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]
name = "pyochain"

[features]
build-docs = []

[dependencies]
color-eyre = "0.6.5"
either = "1.16.0"
pyderive = "0.9"
pyo3 = { version = ">=0.29", features = [
    "either",
    "extension-module",
    "multiple-pymethods",
    "smallvec",
] }
pyo3_ext = { path = "crates/pyo3_ext" }
pyochain_macros = { path = "crates/pyochain_macros" }
smallvec = "1.15.2"
tap = "1.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
