name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  static-analysis:
    name: Static analysis - ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - rust-clippy
          - rust-format
          - ruff-lint
          - ruff-format
          - stub-order
          - stub-docstrings
          - basedpyright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync development environment
        run: uv sync --dev

      - name: Check Rust with Clippy
        run: uv run cargo clippy --workspace
        if: matrix.check == 'rust-clippy'

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        if: matrix.check == 'rust-format'

      - name: Check Python with Ruff
        run: uv run ruff check .
        if: matrix.check == 'ruff-lint'

      - name: Check formatting with Ruff
        run: uv run ruff format --check --preview .
        if: matrix.check == 'ruff-format'

      - name: Check stub ordering
        run: uv run sdsort . --stubs --check
        if: matrix.check == 'stub-order'

      - name: Check stub docstrings
        run: |
          shopt -s globstar
          uv run pydoclint pyochain/**/*.pyi
        if: matrix.check == 'stub-docstrings'

      - name: Check Python types with basedpyright
        run: uv run basedpyright .
        if: matrix.check == 'basedpyright'

  tests:
    name: Tests - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    needs: static-analysis
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Sync test environment
        run: uv sync --python ${{ matrix.python-version }} --dev

      - name: Run Python tests
        run: uv run --python ${{ matrix.python-version }} pytest
