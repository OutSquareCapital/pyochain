name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-linux:
    name: Build Linux wheel - ${{ matrix.target }} - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        target: [x86_64, aarch64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python-version }}
          sccache: 'true'
          manylinux: auto
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  build-windows:
    name: Build Windows wheel - ${{ matrix.target }} - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        target: [x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python-version }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  build-macos:
    name: Build macOS wheel - ${{ matrix.target }} - Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        target: [x86_64, aarch64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python-version }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish packages to PyPI
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/pyochain/
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
      - name: Publish packages to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheel-*/* source-distribution/*