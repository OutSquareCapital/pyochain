[lint]
    external = ["DOC"]
    ignore = [
        "C413",    # Can be a behavioral change who introduce subtle bugs
        "C417",
        "COM812",
        "COM812",
        "CPY001",
        "D401",
        "E501",
        "FIX002",
        "FIX004",
        "PLC0415",
        "PLR0904",
        "PLR2004",
        "PYI021",
        "S101",
        "S301",    # We don't care about cryptographic security
        "S307",    # We don't care about eval
        "S311",    # We don't care about cryptographic security
        "S403",    # We don't care about insecure modules
        "S608",
        "SLF001",
        "T201",
        "TC006",
        "TD002",
        "TD003",
        "TID252",
    ]

    preview = true
    select  = ["ALL"]
[format]
    docstring-code-format = true
    preview               = true
    [lint.pydocstyle]
        convention = "google"
    [lint.per-file-ignores]
        "t.py" = ["ANN201", "D100", "D101", "D102", "D103"]
        "tests/*" = [
            "D",       # We don't want to document tests
            "DOC",     # We don't want to document tests
            "DOC201",
            "DTZ001",
            "FBT001",
            "PLC2801", # Dunders calls are more convenients in tests
        ]
