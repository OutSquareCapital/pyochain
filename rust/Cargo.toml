[workspace]
    members = [".", "./crates/pyochain_macros"]


[package]
    edition = "2024"
    license = "MIT"
    name    = "rs"
    version = "0.1.0"

[lib]
    crate-type = ["cdylib"]
    name       = "rs"

[dependencies]
color-eyre = "0.6.5"
    either = "1.16.0"
    pyderive = "0.9"
    pyo3 = { version = ">=0.29", features = [
        "either",
        "extension-module",
        "multiple-pymethods",
        "smallvec",
    ] }
    pyochain_macros = { path = "crates/pyochain_macros" }
    smallvec = "1.15.2"
    tap = "1.0.1"
[profile.release]
    codegen-units = 1
    lto           = true
    opt-level     = 3
