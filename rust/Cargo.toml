[workspace]
    members = [".", "./crates/bound_from_any"]


[package]
    edition = "2024"
    license = "MIT"
    name    = "rs"
    version = "0.1.0"

[lib]
    crate-type = ["cdylib"]
    name       = "rs"

[dependencies]
    bound_from_any = { path = "crates/bound_from_any" }
    either = "1.16.0"
    pyderive = "0.9"
    pyo3 = { version = ">=0.29", features = [
        "either",
        "extension-module",
        "multiple-pymethods",
    ] }
    tap = "1.0.1"
[profile.release]
    codegen-units = 1
    lto           = true
    opt-level     = 3
