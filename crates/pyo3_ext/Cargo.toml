[package]
name = "pyo3_ext"
version = "0.1.0"
edition = "2024"

[lib]
name = "pyo3_ext"

[dependencies]
either = "1.17.0"
pyo3 = {
  version = ">=0.29",
  features = [
    "either",
    "extension-module",
    "multiple-pymethods",
    "smallvec",
  ]
}
seq-macro = "0.3.6"
smallvec = "1.15.2"
tap = "1.0.1"

[lints]
workspace = true
