[package]
name = "sorted_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "sorted_rs"

[dependencies]
derive_more = { version = "2.1.1", features = ["as_ref", "constructor", "deref", "deref_mut", "from", "into_iterator"] }
derive-new = "0.7.0"
either = "1.16.0"
itertools = "0.15.0"
parking_lot = "0.12.5"
pyo3 = { version = ">=0.29", features = ["either", "extension-module", "multiple-pymethods", "smallvec"] }
pyo3_ext = { path = "../pyo3_ext" }
pyochain_macros = { path = "../pyochain_macros" }
std_tools = { path = "../std_tools" }
tap = "1.0.1"

[lints]
workspace = true
