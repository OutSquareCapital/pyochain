[package]
name = "pyochain_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
derive_more = { version = "2.1.1", features = ["as_ref", "constructor", "deref", "deref_mut", "from", "into_iterator"] }
itertools = "0.15.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.1", features = ["full", "visit-mut"] }
tap = "1.0.1"

[lints]
workspace = true
