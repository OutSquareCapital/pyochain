[project]
site_author = "Thibaud Wilson Stettler"
site_description = "A fast, memory-efficient Python library for fluent iterators, monadic result and option types, and data structures."
site_name = "pyochain"
site_url = "https://outsquarecapital.github.io/pyochain/"

docs_dir = "docs"
extra_javascript = ["javascripts/mermaid.mjs"]
site_dir = "site"

[project.theme]
features = ["navigation.indexes"]
palette = [
  { media = "(prefers-color-scheme: dark)", scheme = "slate", primary = "indigo", accent = "indigo", toggle = { icon = "lucide/moon", name = "Switch to light mode" } },
  { media = "(prefers-color-scheme: light)", scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "lucide/sun", name = "Switch to dark mode" } },
]

[project.plugins.awesome-nav]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "pyochain"
autoapi_add_nav_entry = false
autoapi_ignore = ["_types.pyi", "pyochain.pyi", "__init__.py", "**/__init__.pyi"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["pyochain"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_[^_]"]
inherited_members = false
members_order = "source"
scoped_crossrefs = true
show_inheritance_diagram = true
show_overloads = true
backlinks = "tree"
show_root_toc_entry = false
signature_crossrefs = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
summary = true
type_parameter_headings = true
show_signature_annotations = true
show_signature_type_parameters = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
returns_named_value = false

[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"API" = ["autoapi/**/*.md"]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions."mkdocs_autorefs._internal.references:AutorefsExtension"]
